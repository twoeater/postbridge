{% for post in posts %}<article class="post-card"><div class="meta"><time>{{ post.published_date }}</time></div><h2><a href="/post/{{ post.slug }}">{{ post.title }}</a></h2>{% if post.summary %}<p>{{ post.summary }}</p>{% endif %}{% if post.tag_list %}<div class="tags">{% for tag in post.tag_list %}<a href="/tag/{{ tag }}">#{{ tag }}</a>{% endfor %}</div>{% endif %}</article>{% else %}<p class="empty">아직 게시된 글이 없습니다.</p>{% endfor %}
